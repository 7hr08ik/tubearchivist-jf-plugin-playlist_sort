name: TubeArchivistMetadata Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Release
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from current tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(echo "$TAG" | awk -F. '{printf "%d.%d.%d.%d", $1, $2, $3, ($4==""?0:$4)}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$TAG" >> $GITHUB_ENV

      - name: Setup .Net
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 9.0.x

      - name: Add Jellyfin GitHub Nuget registry to sources
        run: |
          dotnet nuget add source \
            --username 7hr08ik \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github https://nuget.pkg.github.com/jellyfin/index.json

      - name: Generate release message
        run: |
          changelog=$(awk '/changelog:/ {flag=1; next} /^[^ ]/ {flag=0} flag' build.yaml | awk '{$1=$1};1')
          if [[ $(echo "$changelog" | wc -l) -gt 1 ]]; then
              changelog=$(echo "$changelog" | sed 's/^/* /')
          else
              changelog="* $changelog"
          fi
          echo "Changelog:" > release-changelog.md
          echo "$changelog" >> release-changelog.md

      - name: Build Jellyfin Plugin
        uses: DarkFighterLuke/jellyfin-plugin-repository-manager@7a96768accc155ac7b597351b5033532f3c48173
        id: jprm
        with:
          dotnet-target: net9.0
          version: ${{ env.VERSION }}
          update-manifest: "false"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ steps.jprm.outputs.artifact }}
          makeLatest: latest
          bodyFile: release-changelog.md
          tag: ${{ env.TAG }}
          allowUpdates: true

      - name: Prepare manifest update variables
        id: manifest_vars
        run: |
          ARTIFACT_PATH="${{ steps.jprm.outputs.artifact }}"
          ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")
          CHECKSUM=$(md5sum "$ARTIFACT_PATH" | cut -d' ' -f1)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TARGET_ABI=$(grep '^targetAbi:' build.yaml | cut -d' ' -f2- | tr -d '"')
          CHANGELOG=$(awk '/changelog:/ {flag=1; next} /^[^ ]/ {flag=0} flag' build.yaml | awk '{$1=$1};1')
          CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "TARGET_ABI=$TARGET_ABI" >> $GITHUB_OUTPUT
          echo "CHANGELOG_ESCAPED=$CHANGELOG_ESCAPED" >> $GITHUB_OUTPUT

      - name: Write manifest update script
        run: |
          python3 -c "
import base64
script = b'''
import json
import os
import sys

version = os.environ[\"VERSION\"]
tag = os.environ[\"TAG\"]
artifact_name = os.environ[\"ARTIFACT_NAME\"]
checksum = os.environ[\"CHECKSUM\"]
timestamp = os.environ[\"TIMESTAMP\"]
changelog = os.environ[\"CHANGELOG_ESCAPED\"]
target_abi = os.environ[\"TARGET_ABI\"]
github_repo = os.environ[\"GITHUB_REPOSITORY\"]

with open(\"manifest.json\", \"r\") as f:
    manifest = json.load(f)

new_version = {
    \"version\": version,
    \"changelog\": changelog,
    \"targetAbi\": target_abi,
    \"sourceUrl\": f\"https://github.com/{github_repo}/releases/download/{tag}/{artifact_name}\",
    \"checksum\": checksum,
    \"timestamp\": timestamp
}

found = False
for plugin in manifest:
    for i, v in enumerate(plugin[\"versions\"]):
        if v[\"version\"] == new_version[\"version\"]:
            plugin[\"versions\"][i] = new_version
            found = True
            break
    if not found:
        plugin[\"versions\"].insert(0, new_version)

with open(\"manifest.json\", \"w\") as f:
    json.dump(manifest, f, indent=4)

print(\"manifest.json updated successfully\")
'''
with open('update_manifest.py', 'wb') as f:
    f.write(script)
"

      - name: Update manifest.json on master
        run: |
          git fetch origin master:master
          git checkout master
          python3 update_manifest.py
        env:
          VERSION: ${{ env.VERSION }}
          TAG: ${{ env.TAG }}
          ARTIFACT_NAME: ${{ steps.manifest_vars.outputs.ARTIFACT_NAME }}
          CHECKSUM: ${{ steps.manifest_vars.outputs.CHECKSUM }}
          TIMESTAMP: ${{ steps.manifest_vars.outputs.TIMESTAMP }}
          CHANGELOG_ESCAPED: ${{ steps.manifest_vars.outputs.CHANGELOG_ESCAPED }}
          TARGET_ABI: ${{ steps.manifest_vars.outputs.TARGET_ABI }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit manifest.json
        uses: EndBug/add-and-commit@v9
        with:
          add: manifest.json
          commit: --signoff
          message: "Update manifest.json for ${{ env.TAG }}"
          pull: "--no-rebase -X ours origin master"